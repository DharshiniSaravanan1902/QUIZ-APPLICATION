<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainBoost Quiz</title>
  <style>
    :root {
      --primary: #6366f1;
      --correct: #22c55e;
      --incorrect: #ef4444;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e2937, #334155);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 90%;
      background: #0f172a;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: var(--primary);
      padding: 1.5rem;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    .content {
      padding: 2rem;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      margin: 1rem 0;
      font-size: 1.8rem;
    }

    .btn {
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #4f46e5;
      transform: translateY(-2px);
    }

    .progress {
      height: 8px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
      margin: 1.5rem 0;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.4s ease;
    }

    .question {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      padding: 16px;
      background: #1e2937;
      border: 2px solid #334155;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1.1rem;
    }

    .option:hover {
      border-color: var(--primary);
      background: #27344a;
    }

    .option.selected {
      border-color: var(--primary);
      background: #312e81;
    }

    .feedback {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .correct {
      background: rgba(34, 197, 94, 0.2);
      color: var(--correct);
      border: 1px solid var(--correct);
    }

    .incorrect {
      background: rgba(239, 68, 68, 0.2);
      color: var(--incorrect);
      border: 1px solid var(--incorrect);
    }

    .score {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin: 1rem 0;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 2rem;
    }

    .result {
      text-align: center;
    }

    .result h2 {
      margin-bottom: 1rem;
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🧠 BrainBoost</h1>
    </div>

    <div class="content">

      <!-- Welcome Screen -->
      <div id="welcome-screen" class="screen active">
        <div class="welcome">
          <h2>Test Your Knowledge</h2>
          <p style="margin: 1rem 0; color: #94a3b8;">10 Questions • Instant Feedback</p>
          <button class="btn btn-primary" onclick="startQuiz()">Start Quiz</button>
        </div>
      </div>

      <!-- Quiz Screen -->
      <div id="quiz-screen" class="screen">
        <div class="progress">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        
        <div id="question-number" style="text-align: right; margin-bottom: 0.5rem; color: #64748b;"></div>
        
        <div id="question-text" class="question"></div>
        
        <div id="options" class="options"></div>
        
        <div id="feedback" class="feedback" style="display: none;"></div>
        
        <div class="nav-buttons">
          <button id="next-btn" class="btn btn-primary" style="display: none; flex: 1;" onclick="nextQuestion()">
            Next Question →
          </button>
        </div>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="screen result">
        <h2>Quiz Completed!</h2>
        <div id="final-score" class="score">0/10</div>
        <p id="result-message" style="margin: 1rem 0; font-size: 1.2rem;"></p>
        
        <button class="btn btn-primary" onclick="restartQuiz()">Restart Quiz</button>
      </div>
    </div>
  </div>

  <script>
    // Quiz Data
    const questions = [
      {
        question: "What is the capital of France?",
        options: ["London", "Berlin", "Paris", "Madrid"],
        answer: 2
      },
      {
        question: "Which planet is known as the Red Planet?",
        options: ["Venus", "Mars", "Jupiter", "Saturn"],
        answer: 1
      },
      {
        question: "What is the largest ocean on Earth?",
        options: ["Atlantic Ocean", "Indian Ocean", "Arctic Ocean", "Pacific Ocean"],
        answer: 3
      },
      {
        question: "Who painted the Mona Lisa?",
        options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Michelangelo"],
        answer: 2
      },
      {
        question: "What is the chemical symbol for Gold?",
        options: ["Go", "Gd", "Au", "Ag"],
        answer: 2
      },
      {
        question: "How many continents are there?",
        options: ["5", "6", "7", "8"],
        answer: 2
      },
      {
        question: "What is the speed of light?",
        options: ["299,792 km/s", "150,000 km/s", "500,000 km/s", "1,000,000 km/s"],
        answer: 0
      },
      {
        question: "Which language has the most native speakers?",
        options: ["English", "Mandarin Chinese", "Hindi", "Spanish"],
        answer: 1
      },
      {
        question: "What year did the first iPhone launch?",
        options: ["2005", "2007", "2008", "2010"],
        answer: 1
      },
      {
        question: "What is the hardest natural substance on Earth?",
        options: ["Gold", "Iron", "Diamond", "Platinum"],
        answer: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;

    function startQuiz() {
      currentQuestion = 0;
      score = 0;
      document.getElementById('welcome-screen').classList.remove('active');
      document.getElementById('quiz-screen').classList.add('active');
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      
      // Update progress
      document.getElementById('progress-bar').style.width = `${((currentQuestion) / questions.length) * 100}%`;
      document.getElementById('question-number').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      
      // Set question
      document.getElementById('question-text').textContent = q.question;
      
      // Clear previous options
      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';
      
      // Create options
      q.options.forEach((option, index) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = option;
        div.onclick = () => selectAnswer(index, div);
        optionsContainer.appendChild(div);
      });
      
      // Hide feedback and next button
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      selectedAnswer = null;
    }

    function selectAnswer(index, element) {
      // Remove previous selections
      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
      });
      
      element.classList.add('selected');
      selectedAnswer = index;
      
      // Show feedback
      const feedback = document.getElementById('feedback');
      const isCorrect = index === questions[currentQuestion].answer;
      
      if (isCorrect) {
        score++;
        feedback.className = 'feedback correct';
        feedback.textContent = '✅ Correct!';
      } else {
        feedback.className = 'feedback incorrect';
        feedback.textContent = `❌ Incorrect. The correct answer is: ${questions[currentQuestion].options[questions[currentQuestion].answer]}`;
      }
      
      feedback.style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
      currentQuestion++;
      
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.remove('active');
      document.getElementById('result-screen').classList.add('active');
      
      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById('final-score').textContent = `${score}/${questions.length}`;
      
      const message = document.getElementById('result-message');
      if (percentage >= 80) {
        message.textContent = "Excellent! You're a knowledge champion! 🏆";
        message.style.color = '#22c55e';
      } else if (percentage >= 60) {
        message.textContent = "Good job! You did well!";
        message.style.color = '#eab308';
      } else {
        message.textContent = "Keep learning! Practice makes perfect.";
        message.style.color = '#ef4444';
      }
    }

    function restartQuiz() {
      document.getElementById('result-screen').classList.remove('active');
      document.getElementById('welcome-screen').classList.add('active');
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.getElementById('next-btn').style.display !== 'none') {
        nextQuestion();
      }
    });
  </script>
</body>
</html>
